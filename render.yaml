# Blueprint de Render. El servicio se llama igual que el repositorio.
services:
  - type: web
    name: hr-assistant
    runtime: docker
    plan: free
    healthCheckPath: /health
    # Publica solo si el pipeline de CI pasa.
    autoDeployTrigger: checksPass
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: MODEL_PROVIDER
        value: gateway
      - key: HIDE_INPUTS
        value: "true"
      - key: HIDE_OUTPUTS
        value: "true"
      # Trazas: sin LANGSMITH_API_KEY (se escribe en Render > Environment) no se conecta.
      - key: LANGSMITH_TRACING
        value: "true"
      - key: LANGSMITH_PROJECT
        value: hr-assistant
      # Secretos: se escriben en Render, nunca en el repositorio.
      - key: API_KEYS
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_GATEWAY_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
